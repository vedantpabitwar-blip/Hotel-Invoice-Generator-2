<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Invoice Generator</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Code Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>

<body>

    <div class="container">

        <h1>🍴 Hotel Invoice Generator</h1>

        <!-- Customer Details -->
        <div class="box">

            <label>Customer Name</label>
            <input type="text" id="name" placeholder="Enter Name">

            <label>Mobile Number</label>
            <input type="text" id="mobile"
                   placeholder="Enter Mobile Number"
                   maxlength="10">

            <button onclick="sendOTP()">Send OTP</button>

            <div id="otpBox" style="display:none;">

                <label>Enter OTP</label>

                <input type="text" id="otp" placeholder="Enter OTP">

                <button onclick="verifyOTP()">Verify OTP</button>

            </div>

            <p id="message"></p>

        </div>


        <!-- Invoice -->
        <div id="invoiceBox" style="display:none;">

            <h2>Food Menu</h2>

            <table>

                <tr>
                    <th>Item</th>
                    <th>Price</th>
                    <th>Qty</th>
                </tr>

                <tr>
                    <td>Pizza</td>
                    <td>₹200</td>
                    <td>
                        <input type="number" id="pizza" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Burger</td>
                    <td>₹120</td>
                    <td>
                        <input type="number" id="burger" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Sandwich</td>
                    <td>₹100</td>
                    <td>
                        <input type="number" id="sandwich" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Tea</td>
                    <td>₹20</td>
                    <td>
                        <input type="number" id="tea" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Coffee</td>
                    <td>₹40</td>
                    <td>
                        <input type="number" id="coffee" value="0" min="0">
                    </td>
                </tr>

                <tr>
                    <td>Cold Drink</td>
                    <td>₹50</td>
                    <td>
                        <input type="number" id="cold" value="0" min="0">
                    </td>
                </tr>

            </table>

            <button onclick="generateBill()">
                Generate Invoice
            </button>

            <button onclick="resetForm()">
                Reset
            </button>

            <!-- Bill -->
            <div id="bill"></div>


            <!-- Payment Section -->
            <div id="paymentBox" style="display:none;">

                <h2>💳 Scan & Pay</h2>

                <p class="paymentText">
                    Scan the QR code using PhonePe, Google Pay,
                    Paytm or any UPI app.
                </p>

                <div id="qrcode"></div>

                <h3 id="payAmount"></h3>

                <button onclick="payUsingUPI()">
                    📱 Open UPI App
                </button>

                <button onclick="paymentSuccess()">
                    ✅ Payment Done
                </button>

                <p id="paymentMessage"></p>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
